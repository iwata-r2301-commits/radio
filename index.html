<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アモーレ深夜便 | お便り投稿フォーム</title>
  <style>
    :root {
      --bg-dark: #050a14;
      --panel-bg: #0a1628;
      --neon-cyan: #00f3ff;
      --neon-turquoise: #1de9b6;
      --neon-pink: #ff3b9a;
      --text-main: #e0f7fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.16) 0%, transparent 60%),
        radial-gradient(circle at 85% 90%, rgba(255, 59, 154, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* オープニングアイキャッチ画面 */
    #opening-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      animation: fadeOutScreen 0.8s ease-in-out 2.6s forwards;
      pointer-events: none;
    }

    .logo-container {
      text-align: center;
      animation: logoZoomIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-container img {
      width: 100%;
      max-width: 340px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.55));
    }

    .tuning-bar {
      width: 220px;
      height: 3px;
      background: rgba(0, 243, 255, 0.2);
      margin-top: 22px;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .tuning-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink));
      animation: scan 1.5s linear infinite;
    }

    /* メインのレトロフューチャー・ラジオ本体 */
    .radio-deck {
      width: 100%;
      max-width: 480px;
      background: var(--panel-bg);
      border: 2px solid var(--neon-cyan);
      border-radius: 18px;
      padding: 24px 22px 28px;
      box-shadow: 
        0 0 28px rgba(0, 243, 255, 0.25),
        inset 0 0 20px rgba(0, 243, 255, 0.1);
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInDeck 0.8s ease-out 2.8s forwards;
    }

    .deck-logo {
      text-align: center;
      margin-bottom: 14px;
    }

    .deck-logo img {
      max-width: 190px;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.4));
    }

    .radio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 243, 255, 0.25);
      border-bottom: 1px solid rgba(0, 243, 255, 0.25);
      padding: 12px 0;
      margin-bottom: 22px;
    }

    .frequency-display {
      font-family: monospace;
      color: var(--neon-turquoise);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
    }

    .frequency-scale {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .frequency-scale span {
      display: block;
      width: 2px;
      height: 7px;
      background: rgba(0, 243, 255, 0.35);
    }

    .frequency-scale span.active {
      height: 11px;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    .on-air-badge {
      padding: 6px 14px;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
    }

    .on-air-badge.lit {
      color: #fff;
      border-color: var(--neon-pink);
      background: rgba(255, 59, 154, 0.22);
      text-shadow: 0 0 8px var(--neon-pink);
      box-shadow: 0 0 16px var(--neon-pink), inset 0 0 10px var(--neon-pink);
      animation: pulseLamp 1s infinite alternate;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--neon-turquoise);
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: rgba(4, 9, 18, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.45);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.22), rgba(29, 233, 182, 0.22));
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.4), rgba(29, 233, 182, 0.4));
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-message {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--neon-turquoise);
      min-height: 1.4em;
      text-shadow: 0 0 8px rgba(29, 233, 182, 0.5);
    }

    @keyframes logoZoomIn {
      0% { opacity: 0; transform: scale(0.88); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes scan {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    @keyframes fadeOutScreen {
      to { opacity: 0; visibility: hidden; }
    }

    @keyframes fadeInDeck {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseLamp {
      from { box-shadow: 0 0 10px var(--neon-pink); }
      to { box-shadow: 0 0 24px var(--neon-pink), 0 0 6px #fff; }
    }
  </style>
</head>
<body>

  <!-- オープニング演出 -->
  <div id="opening-screen">
    <div class="logo-container">
      <img src="logo.PNG" alt="アモーレ深夜便">
    </div>
    <div class="tuning-bar"></div>
  </div>

  <!-- お便り投稿デッキ -->
  <main class="radio-deck">
    <div class="deck-logo">
      <img src="logo.png" alt="アモーレ深夜便">
    </div>

    <div class="radio-header">
      <div>
        <div class="frequency-display">AMORE MIDNIGHT // TUNED</div>
        <div class="frequency-scale">
          <span></span><span></span><span class="active"></span><span></span><span></span>
          <span></span><span class="active"></span><span></span><span></span><span></span>
        </div>
      </div>
      <div id="on-air-lamp" class="on-air-badge">ON AIR</div>
    </div>
    <form action="https://formsubmit.co" method="POST">
      <input type="hidden" name="_subject" value="【アモーレ深夜便】新しいお便りが届きました！">
      <input type="hidden" name="_captcha" value="false">

      <div class="form-group">
        <label for="nickname">RADIO NAME / ニックネーム</label>
        <input type="text" id="nickname" name="ニックネーム" placeholder="例：深夜のリスナー" required>
      </div>

      <div class="form-group">
        <label for="message">MESSAGE / お便り内容</label>
        <textarea id="message" name="お便り内容" placeholder="アモーレ深夜便に送るメッセージや質問を書いてね！" required></textarea>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">SEND LETTER</button>
    </form>

  </main>

  <script>
    // ▼ ここをあなたのGmailアドレスに書き換えてください（1ヶ所だけ！）
    const MY_EMAIL = "aopiku01@gmail.com";

    const form = document.getElementById('letter-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');
    const onAirLamp = document.getElementById('on-air-lamp');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nickname = document.getElementById('nickname').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!nickname || !message) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "TRANSMITTING...";
      onAirLamp.classList.add('lit');
      statusMsg.textContent = "電波に乗せて送信中...";

      try {
        const response = await fetch(`https://formsubmit.co{MY_EMAIL}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            _subject: "【アモーレ深夜便】新しいお便りが届きました！",
            ニックネーム: nickname,
            お便り内容: message
          })
        });

        if (response.ok) {
          submitBtn.textContent = "SENT!";
          statusMsg.textContent = "お便りを受け付けました！配信をお楽しみに！";
          form.reset();
        } else {
          throw new Error('送信エラー');
        }

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = "SEND LETTER";
          onAirLamp.classList.remove('lit');
          statusMsg.textContent = "";
        }, 4000);

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "SEND LETTER";
        onAirLamp.classList.remove('lit');
        statusMsg.textContent = "送信に失敗しました。もう一度お試しください。";
      }
    });
  </script>
</body>
</html>
